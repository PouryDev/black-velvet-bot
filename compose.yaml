services:
  bot:
    build: .
    image: black-velvet-bot:local
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env}
      DB_PATH: /app/data/bot.db
      PORT: 8033
    ports:
      - "${BOT_BIND_ADDRESS:-0.0.0.0}:8033:8033"
    volumes:
      - bot_data:/app/data
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8033/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  bot_data:
    name: black_velvet_data
